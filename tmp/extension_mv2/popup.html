<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Facts</title>
    <style>
        body {
            width: 350px;
            min-height: 200px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8B4513, #D2B48C);
            margin: 0;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .fact-container {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .fact-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .button {
            background: #8B4513;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
        }

        .button:hover {
            background: #A0522D;
        }

        .history-container {
            max-height: 150px;
            overflow-y: auto;
            background: white;
            border-radius: 10px;
            padding: 10px;
        }

        .history-item {
            font-size: 12px;
            padding: 5px;
            border-bottom: 1px solid #eee;
            line-height: 1.3;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            color: white;
            font-style: italic;
        }

        .toggle-button {
            background: #D2B48C;
            color: #8B4513;
        }

        .toggle-button:hover {
            background: #DDD;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Capybara Facts</h2>
    </div>

    <div class="fact-container">
        <div class="fact-text" id="current-fact">
            <div class="loading">Loading capybara fact...</div>
        </div>
        <button class="button" id="new-fact-btn">Get New Fact</button>
    </div>

    <button class="button toggle-button" id="toggle-history-btn">Show History (0)</button>

    <div class="history-container" id="history-container" style="display: none;">
        <div id="history-list"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
