[project]
name = "agentictester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "botocore>=1.43.9",
    "openhands-sdk>=1.29.0",
    "openhands-tools>=1.29.0",
    "openhands-workspace>=1.29.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
agentictester = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.basedpyright]
# Upstream-pyright "standard" posture. basedpyright's default ("recommended") floods
# reportUnknown*/reportAny because the OpenHands SDK ships no type information; those
# warnings aren't actionable in our code.
typeCheckingMode = "standard"
# The verify skill's scripts run inside the container with their own deps (playwright,
# websocket-client) and are imported as scripts (sys.path[0]); they're validated by
# running, not by host type-checking.
exclude = [
    "**/__pycache__",
    ".venv",
    "src/skills/*/scripts",
]
